<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOFI • Detalle Desarrollo</title>
  <link rel="stylesheet" href="../css/styles.css?v=6">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="login-screen" style="display:none"></div>
  <div id="app-shell">
    <div class="sidebar-scrim" id="sidebar-scrim" onclick="toggleSidebar()"></div>
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-logo"><div class="sidebar-logo-text">SOFI<span>.</span></div></div>
      <div class="sidebar-role-badge" id="sb-role-badge"></div>
      <div class="sidebar-nav" id="sb-nav"></div>
      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="sidebar-avatar" id="sb-avatar"></div>
          <div class="sidebar-user-info">
            <span class="sidebar-user-name" id="sb-name"></span>
            <span class="sidebar-user-role" id="sb-role"></span>
          </div>
        </div>
        <button type="button" class="sidebar-logout" onclick="doLogout()">Cerrar sesión</button>
      </div>
    </nav>

    <div class="main-content">
      <div class="topbar">
        <div style="display:flex;align-items:center;gap:12px;min-width:0">
          <button type="button" class="sidebar-toggle" onclick="toggleSidebar()"></button>
          <div class="breadcrumb" id="breadcrumb"><span>SOFI</span><span class="sep">•</span><a href="desarrollos.html">Desarrollos</a><span class="sep">•</span><span class="current">Detalle</span></div>
        </div>
        <div class="topbar-actions">
          <button type="button" class="topbar-btn" onclick="showModal('alertas-modal')"> Alertas <span class="badge-notif" id="notif-count">0</span></button>
          <button type="button" class="topbar-btn" onclick="window.location.href='configuracion.html'"> Configuración</button>
        </div>
      </div>

      <main class="page-content" id="page-content">
        <div class="section-header">
          <div>
            <div class="section-title" id="detalle-nombre">Cargando...</div>
            <p style="font-size:12px;color:var(--c-muted);" id="detalle-ubicacion">?? Cargando ubicación...</p>
            <p style="font-size:13px;color:var(--c-muted);margin-top:4px;" id="detalle-descripcion"></p>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button id="btn-ver-plano" class="btn-outline btn-sm" style="display:none;" onclick="abrirModal('ver-plano-modal')">Ver Plano</button>
            <button class="btn-accent btn-sm" onclick="abrirModal('crear-manzana-modal')">+ Nueva Manzana</button>
            <button class="btn-outline btn-sm" onclick="window.location.href='desarrollos.html'">Volver</button>
          </div>
        </div>

        <div id="manzanas-container" style="margin-top:20px;"></div>
      </main>
    </div>
  </div>

  <!-- MODAL CREAR MANZANA -->
  <div id="crear-manzana-modal" class="modal-overlay" style="display:none;">
    <div class="modal-box" style="max-width:680px;max-height:90vh;overflow-y:auto;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <div class="modal-title">Nueva Manzana</div>
        <button onclick="cerrarModal('crear-manzana-modal')" style="font-size:20px;background:none;border:none;cursor:pointer;">&times;</button>
      </div>
      <form id="form-crear-manzana" onsubmit="event.preventDefault(); guardarManzanaModal();">
        <div class="form-grid">
          <div class="form-group full">
            <label>Desarrollo *</label>
            <select id="manzana-desarrollo" required>
              <option value="">Seleccionar desarrollo...</option>
            </select>
          </div>
          <div class="form-group">
            <label>Número de Manzana *</label>
            <input id="manzana-numero" type="number" placeholder="1" min="1" required>
          </div>
          <div class="form-group full">
            <label>Calles Colindantes</label>
            <input id="manzana-calles" type="text" placeholder="Ej. Calle Principal y Calle Secundaria">
          </div>
          <div class="form-group full">
            <label>Número de Lotes que tendrà esta Manzana *</label>
            <input id="manzana-cantidad-lotes" type="number" placeholder="Ej. 10" min="1" required>
            <span class="hint">Los lotes se crearán automáticamente con números correlativos</span>
          </div>
        </div>

        <div id="vista-previa-lotes" style="margin-top:16px;padding:16px;background:var(--c-light-bg);border-radius:var(--radius);display:none;">
          <div style="font-weight:600;font-size:13px;margin-bottom:8px;">Vista previa de lotes:</div>
          <div id="lista-lotes-preview" style="display:flex;flex-wrap:wrap;gap:8px;"></div>
        </div>

        <div class="form-actions">
          <button type="button" class="btn-outline" onclick="cerrarModal('crear-manzana-modal')">Cancelar</button>
          <button type="submit" class="btn-accent">Crear Manzana y Lotes</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL EDITAR MANZANA -->
  <div id="editar-manzana-modal" class="modal-overlay" style="display:none;">
    <div class="modal-box" style="max-width:500px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <div class="modal-title" id="editar-titulo">Editar Manzana</div>
        <button onclick="cerrarModal('editar-manzana-modal')" style="font-size:20px;background:none;border:none;cursor:pointer;">&times;</button>
      </div>
      <form id="form-editar-manzana" onsubmit="event.preventDefault(); actualizarManzanaModal();">
        <input type="hidden" id="edit-manzana-id">
        <input type="hidden" id="edit-desarrollo-nombre">
        <div class="form-grid">
          <div class="form-group">
            <label>Número de Manzana *</label>
            <input id="edit-manzana-numero" type="number" min="1" required>
          </div>
          <div class="form-group full">
            <label>Calles Colindantes</label>
            <input id="edit-manzana-calles" type="text" placeholder="Ej. Calle Principal y Secundaria">
          </div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn-outline" onclick="cerrarModal('editar-manzana-modal')">Cancelar</button>
          <button type="submit" class="btn-accent">Actualizar Manzana</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL CREAR LOTE EN MANZANA -->
  <div id="crear-lote-manzana-modal" class="modal-overlay" style="display:none;">
    <div class="modal-box" style="max-width:720px;max-height:90vh;overflow-y:auto;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <div class="modal-title" id="crear-lote-titulo">Nuevo Lote</div>
        <button onclick="cerrarModal('crear-lote-manzana-modal')" style="font-size:20px;background:none;border:none;cursor:pointer;">&times;</button>
      </div>
      <form id="form-crear-lote-manzana" onsubmit="event.preventDefault(); guardarLoteExtraManzana();">
        <input type="hidden" id="lote-manzana-id">
        <div class="form-grid">
          <div class="form-group">
            <label>Desarrollo *</label>
            <select id="lote-manzana-desarrollo" required onchange="cargarManzanasDesarrolloDetalle(this.value, 'lote-manzana-manzana')">
              <option value="">Seleccionar desarrollo...</option>
            </select>
          </div>
          <div class="form-group">
            <label>Manzana *</label>
            <select id="lote-manzana-manzana" required>
              <option value="">Seleccione un desarrollo primero</option>
            </select>
          </div>
          <div class="form-group">
            <label>Número de Lote *</label>
            <input id="lote-extra-numero" type="text" placeholder="Ej. A-12" required>
          </div>
          <div class="form-group">
            <label>Superficie (m²) *</label>
            <input id="lote-extra-medidas" type="number" placeholder="120" min="1" required>
          </div>
          <div class="form-group">
            <label>Precio de Lista *</label>
            <input id="lote-extra-precio" type="number" placeholder="350000" min="0" required>
          </div>
          <div class="form-group">
            <label>Estatus *</label>
            <select id="lote-extra-estado" required>
              <option value="Disponible">Disponible</option>
              <option value="Vendido">Vendido</option>
              <option value="Reservado">Reservado</option>
            </select>
          </div>
          <div class="form-group full"><label>Colindancias y Medidas Exactas</label></div>
          <div style="display:flex; gap:10px; width: 100%;">
            <div class="form-group" style="flex:1"><label>Norte (Colindante)</label><input id="lote-extra-norte" placeholder="Descripción del colindante"></div>
            <div class="form-group" style="width:120px"><label>Medida (m)</label><input id="lote-extra-medida-norte" type="number" step="0.01" placeholder="Ej. 10.5"></div>
          </div>
          <div style="display:flex; gap:10px; width: 100%;">
            <div class="form-group" style="flex:1"><label>Sur (Colindante)</label><input id="lote-extra-sur" placeholder="Descripción del colindante"></div>
            <div class="form-group" style="width:120px"><label>Medida (m)</label><input id="lote-extra-medida-sur" type="number" step="0.01" placeholder="Ej. 10.5"></div>
          </div>
          <div style="display:flex; gap:10px; width: 100%;">
            <div class="form-group" style="flex:1"><label>Este (Colindante)</label><input id="lote-extra-este" placeholder="Descripción del colindante"></div>
            <div class="form-group" style="width:120px"><label>Medida (m)</label><input id="lote-extra-medida-este" type="number" step="0.01" placeholder="Ej. 10.5"></div>
          </div>
          <div style="display:flex; gap:10px; width: 100%;">
            <div class="form-group" style="flex:1"><label>Oeste (Colindante)</label><input id="lote-extra-oeste" placeholder="Descripción del colindante"></div>
            <div class="form-group" style="width:120px"><label>Medida (m)</label><input id="lote-extra-medida-oeste" type="number" step="0.01" placeholder="Ej. 10.5"></div>
          </div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn-outline" onclick="cerrarModal('crear-lote-manzana-modal')">Cancelar</button>
          <button type="submit" class="btn-accent">Guardar Lote</button>
        </div>
      </form>
    </div>
  </div>

  <div id="modal-root"></div>

  <!-- MODAL VER PLANO -->
  <div id="ver-plano-modal" class="modal-overlay" style="display:none;">
    <div class="modal-box" style="max-width:90vw;max-height:90vh;display:flex;flex-direction:column;padding:12px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <div class="modal-title">Plano del Desarrollo</div>
        <button onclick="cerrarModal('ver-plano-modal')" style="font-size:24px;background:none;border:none;cursor:pointer;color:var(--c-muted);">&times;</button>
      </div>
      <div style="flex:1;overflow:auto;display:flex;justify-content:center;align-items:center;background:#000;border-radius:8px;">
        <img id="img-plano-desarrollo" src="" style="max-width:100%;max-height:100%;object-fit:contain;cursor:zoom-in;" onclick="this.style.maxHeight=this.style.maxHeight==='100%'?'none':'100%'; this.style.cursor=this.style.cursor==='zoom-in'?'zoom-out':'zoom-in';">
      </div>
    </div>
  </div>

  <!-- SCRIPTS - SOLO LOS MODULOS NECESARIOS -->
  <script src="../js/core/config.js?v=4"></script>
  <script src="../js/utils/helpers.js?v=2"></script>
  <script src="../js/core/app.js?v=3"></script>
  <script src="../js/modules/desarrollos.js?v=2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>
</html>
