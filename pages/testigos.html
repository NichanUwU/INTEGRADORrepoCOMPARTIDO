<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOFI • Testigos</title>
  <link rel="stylesheet" href="../css/styles.css?v=6">
  <style>
    /* Estilos especificos para testigos */
  </style>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="login-screen" style="display:none"></div>
  <div id="app-shell">
    <div class="sidebar-scrim" id="sidebar-scrim" onclick="toggleSidebar()"></div>
    
    <!-- SIDEBAR -->
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-logo"><div class="sidebar-logo-text">SOFI<span>.</span></div></div>
      <div class="sidebar-role-badge" id="sb-role-badge"></div>
      <div class="sidebar-nav" id="sb-nav"></div>
      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="sidebar-avatar" id="sb-avatar"></div>
          <div class="sidebar-user-info">
            <span class="sidebar-user-name" id="sb-name"></span>
            <span class="sidebar-user-role" id="sb-role"></span>
          </div>
        </div>
        <button type="button" class="sidebar-logout" onclick="doLogout()">Cerrar sesión</button>
      </div>
    </nav>

    <div class="main-content">
      <div class="topbar">
        <div style="display:flex;align-items:center;gap:12px;min-width:0">
          <button type="button" class="sidebar-toggle" onclick="toggleSidebar()">?</button>
          <div class="breadcrumb" id="breadcrumb"><span>SOFI</span><span class="sep">�</span><span class="current">Testigos</span></div>
        </div>
        <div class="topbar-actions">
          <button type="button" class="topbar-btn" onclick="showModal('alertas-modal')"> Alertas <span class="badge-notif" id="notif-count">0</span></button>
          <button type="button" class="topbar-btn" onclick="window.location.href='configuracion.html'"> Configuración</button>
        </div>
      </div>

      <main class="page-content" id="page-content">
        <div class="section-header">
          <div class="section-title">Gestión de Testigos</div>
          <div>
            <button class="btn-outline" style="margin-right:12px;" onclick="window.location.href='clientes.html'">Volver a Clientes</button>
            <button class="btn-accent" onclick="abrirModalCrearTestigo()">Nuevo Testigo</button>
          </div>
        </div>

        <div class="table-wrap">
          <div class="table-toolbar">
            <input id="search-testigo" class="search-input" placeholder="Buscar testigo (nombre, cliente...)" style="max-width:300px" oninput="filtrarTestigos()">
          </div>
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Teléfono</th>
                <th>Ciudad</th>
                <th>Estado</th>
                <th>Cliente Añociado</th>
                <th style="width:140px;text-align:right">Acciónes</th>
              </tr>
            </thead>
            <tbody id="tabla-testigos-body">
              <tr><td colspan="7" style="text-align:center;padding:20px;color:var(--c-muted)">Cargando testigos...</td></tr>
            </tbody>
          </table>
          <div class="table-pagination" id="testigos-paginacion">Mostrando 0 testigos</div>
        </div>
      </main>
    </div>
  </div>

  <div id="modal-root"></div>

  <!-- MODAL NUEVO TESTIGO -->
  <div class="modal-overlay" id="crear-testigo-modal" style="display:none;">
    <div class="modal-box" style="max-width:720px;max-height:90vh;overflow-y:auto;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <div class="modal-title">Nuevo Testigo</div>
        <button onclick="cerrarModal('crear-testigo-modal')" style="font-size:20px;background:none;border:none;cursor:pointer;">X</button>
      </div>
      <form id="form-crear-testigo" onsubmit="event.preventDefault(); guardarTestigo();">
        <div class="form-grid">
          <div class="form-group"><label>Nombre(s)*</label><input type="text" id="t-nombre" class="form-input" required></div>
          <div class="form-group"><label>Apellidos*</label><input type="text" id="t-apellidos" class="form-input" required></div>
          <div class="form-group full" style="grid-column: 1 / -1;"><label>Cliente Añociado*</label><select id="t-cliente" class="form-select" required></select></div>
          <div class="form-group full" style="grid-column: 1 / -1;"><label>Dirección</label><input type="text" id="t-direccion" class="form-input"></div>
          <div class="form-group"><label>Casa / Apto</label><input type="text" id="t-casa" class="form-input"></div>
          <div class="form-group"><label>C�digo Postal</label><input type="text" id="t-cp" class="form-input"></div>
          <div class="form-group"><label>Ciudad</label><input type="text" id="t-ciudad" class="form-input"></div>
          <div class="form-group"><label>Estado</label><input type="text" id="t-estado" class="form-input"></div>
          <div class="form-group"><label>Teléfono</label><input type="text" id="t-telefono" class="form-input"></div>
        </div>
        <div class="form-actions" style="margin-top: 16px;">
          <button type="button" class="btn-outline" onclick="cerrarModal('crear-testigo-modal')">Cancelar</button>
          <button type="submit" class="btn-accent">Guardar Testigo</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL EDITAR TESTIGO -->
  <div class="modal-overlay" id="editar-testigo-modal" style="display:none;">
    <div class="modal-box" style="max-width:720px;max-height:90vh;overflow-y:auto;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <div class="modal-title">Editar Testigo</div>
        <button onclick="cerrarModal('editar-testigo-modal')" style="font-size:20px;background:none;border:none;cursor:pointer;">X</button>
      </div>
      <form id="form-editar-testigo" onsubmit="event.preventDefault(); actualizarTestigo();">
        <input type="hidden" id="edit-t-id">
        <div class="form-grid">
          <div class="form-group"><label>Nombre(s)*</label><input type="text" id="edit-t-nombre" class="form-input" required></div>
          <div class="form-group"><label>Apellidos*</label><input type="text" id="edit-t-apellidos" class="form-input" required></div>
          <div class="form-group full" style="grid-column: 1 / -1;"><label>Cliente Añociado*</label><select id="edit-t-cliente" class="form-select" required></select></div>
          <div class="form-group full" style="grid-column: 1 / -1;"><label>Dirección</label><input type="text" id="edit-t-direccion" class="form-input"></div>
          <div class="form-group"><label>Casa / Apto</label><input type="text" id="edit-t-casa" class="form-input"></div>
          <div class="form-group"><label>C�digo Postal</label><input type="text" id="edit-t-cp" class="form-input"></div>
          <div class="form-group"><label>Ciudad</label><input type="text" id="edit-t-ciudad" class="form-input"></div>
          <div class="form-group"><label>Estado</label><input type="text" id="edit-t-estado" class="form-input"></div>
          <div class="form-group"><label>Teléfono</label><input type="text" id="edit-t-telefono" class="form-input"></div>
        </div>
        <div class="form-actions" style="margin-top: 16px;">
          <button type="button" class="btn-outline" onclick="cerrarModal('editar-testigo-modal')">Cancelar</button>
          <button type="submit" class="btn-accent">Guardar Cambios</button>
        </div>
      </form>
    </div>
  </div>

  <!-- SCRIPTS -->
  <script src="../js/core/config.js?v=4"></script>
  <script src="../js/utils/helpers.js"></script>
  <script src="../js/core/app.js?v=3"></script>
  <script src="../js/modules/testigos.js"></script>
</body>
</html>
